<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>biobook</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--abyss:#021a19;--deep:#06302d;--teal:#2bb3a6;--mist:#9fd1ca;--foam:#e4f6f2;--line:#14504a}
*{box-sizing:border-box;margin:0}
body{background:var(--abyss);color:var(--mist);font:400 1rem/1.6 "Manrope",system-ui,sans-serif;min-height:100svh}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:auto;padding:16px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--foam);font-weight:600;font-size:1.2rem}
header .sp{margin-left:auto;font-size:.85rem;font-weight:400}
input,button,textarea{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--foam);padding:10px 12px;width:100%}
button{background:var(--teal);color:var(--abyss);border:0;font-weight:600;cursor:pointer}
button.g{background:none;color:var(--mist);border:1px solid var(--line);width:auto;padding:6px 12px;font-weight:400}
.col{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px}.tabs button{background:var(--deep);color:var(--mist)}.tabs button.on{background:var(--teal);color:var(--abyss)}
.card{background:var(--deep);border-radius:14px;margin:14px 0;overflow:hidden}
.card .h{padding:10px 14px;color:var(--foam);font-weight:600;display:flex;align-items:center}
.card img{width:100%;display:block}
.card p{padding:10px 14px}
.msg{color:#ffb4a8;font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg width="30" height="33" viewBox="0 0 110 120" aria-label="biobook"><path d="M20 12H56C80 12 92 24 92 39C92 49 87 56 80 59C91 63 97 71 97 83C97 101 83 112 58 112H20Z" fill="#ffe51a" stroke="#1f4fb0" stroke-width="12" stroke-linejoin="round"/><path d="M42 30H54C62 30 66 34 66 39C66 44 62 48 54 48H42ZM42 68H56C65 68 70 72 70 80C70 88 65 94 56 94H42Z" fill="#1f4fb0"/></svg>
biobook<span class="sp" id="who"></span><button class="g" id="out" hidden>Log out</button>
</header>

<div id="auth" class="col" hidden>
<div class="tabs"><button id="t-in" class="on">Log in</button><button id="t-up">Sign up</button></div>
<input id="un" placeholder="Username" hidden autocapitalize="none">
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Password (at least 8 characters)" autocomplete="current-password">
<button id="go">Log in</button>
<div class="msg" id="am"></div>
</div>

<div id="app" hidden>
<div class="col">
<textarea id="cap" rows="2" placeholder="What is on your mind?"></textarea>
<input id="file" type="file" accept="image/*,video/*">
<button id="post">Post</button>
<div class="msg" id="pm"></div>
</div>
<div id="feed"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://phrxgyjzalrhadwjreio.supabase.co","sb_publishable_60EewNpV4m19eOgdcpTKVw_rxcZYf7D");
var $=function(i){return document.getElementById(i)},mode="in",me=null;
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function setMode(m){mode=m;$("t-in").className=m=="in"?"on":"";$("t-up").className=m=="up"?"on":"";$("un").hidden=m!="up";$("go").textContent=m=="in"?"Log in":"Create account";$("am").textContent=""}
$("t-in").onclick=function(){setMode("in")};$("t-up").onclick=function(){setMode("up")};
$("go").onclick=async function(){
  var email=$("em").value.trim(),password=$("pw").value,r;
  $("am").textContent="";
  if(mode=="up"){
    var u=$("un").value.trim().toLowerCase();
    if(!/^[a-z0-9_.]{3,20}$/.test(u)){$("am").textContent="Username must be 3–20 characters: a-z, 0-9, _ and .";return}
    r=await sb.auth.signUp({email:email,password:password,options:{data:{username:u}}});
    if(!r.error&&!r.data.session){$("am").style.color="#9fd1ca";$("am").textContent="Check your email to confirm, then log in.";return}
  }else r=await sb.auth.signInWithPassword({email:email,password:password});
  if(r.error){$("am").style.color="#ffb4a8";$("am").textContent=r.error.message}
};
$("out").onclick=function(){sb.auth.signOut()};
async function enter(session){
  me=session?session.user:null;
  $("auth").hidden=!!me;$("app").hidden=!me;$("out").hidden=!me;
  if(!me){$("who").textContent="";return}
  var p=await sb.from("profiles").select("username").eq("id",me.id).single();
  $("who").textContent=p.data?"@"+p.data.username:"";
  feed();
}
sb.auth.onAuthStateChange(function(_e,s){setTimeout(function(){enter(s)},0)});
async function feed(){
  var r=await sb.from("posts").select("id,caption,media_path,created_at,user_id,profiles(username)").order("created_at",{ascending:false}).limit(30);
  if(r.error){$("feed").innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}
  $("feed").innerHTML=r.data.map(function(x){
    var url=x.media_path?sb.storage.from("media").getPublicUrl(x.media_path).data.publicUrl:"";
    var vid=/\.(mp4|mov|webm)$/i.test(x.media_path||"");
    return '<div class="card"><div class="h">@'+esc(x.profiles&&x.profiles.username)+(x.user_id==me.id?'<button class="g" style="margin-left:auto" data-d="'+x.id+'" data-p="'+esc(x.media_path||"")+'">Delete</button>':'')+'</div>'+
      (url?(vid?'<video src="'+url+'" controls playsinline></video>':'<img src="'+url+'" alt="" loading="lazy">'):'')+
      '<p>'+esc(x.caption)+'</p></div>';
  }).join("")||'<p style="margin-top:20px">No posts yet.</p>';
}
$("feed").onclick=async function(e){
  var b=e.target.closest("[data-d]");if(!b||!confirm("Delete this post?"))return;
  await sb.from("posts").delete().eq("id",b.dataset.d);
  if(b.dataset.p)await sb.storage.from("media").remove([b.dataset.p]);
  feed();
};
$("post").onclick=async function(){
  var cap=$("cap").value.trim(),f=$("file").files[0],path=null;
  if(!cap&&!f){$("pm").textContent="Write something or choose a file";return}
  $("pm").textContent="Uploading…";
  if(f){
    var ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    path=me.id+"/"+Date.now()+"."+ext;
    var up=await sb.storage.from("media").upload(path,f);
    if(up.error){$("pm").textContent=up.error.message;return}
  }
  var r=await sb.from("posts").insert({user_id:me.id,caption:cap,media_path:path});
  if(r.error){$("pm").textContent=r.error.message;return}
  $("cap").value="";$("file").value="";$("pm").textContent="";feed();
};
sb.auth.getSession().then(function(r){enter(r.data.session)});
setMode("in");
</script>
</body>
</html>
