<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}

.v{padding:0 16px}

.bar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;color:var(--foam);font-weight:700;font-size:1.15rem;position:sticky;top:0;background:var(--abyss);z-index:5}

.ib{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--foam);background:none;border:0;cursor:pointer;padding:0;transition:background .2s,transform .15s}
.ib:active{transform:scale(.92);background:var(--deep)}
input,button,textarea,select{font:inherit;border-radius:14px;border:1px solid var(--line);background:var(--deep);color:var(--foam);padding:12px 14px;width:100%;outline:0;transition:border-color .2s,transform .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
button{background:var(--teal);color:var(--abyss);border:0;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
button.g{background:var(--deep);color:var(--foam);border:1px solid var(--line)}
button.s{width:auto;padding:7px 14px;font-size:.85rem;border-radius:20px}
.col{display:flex;flex-direction:column;gap:12px}
.msg{color:var(--coral);font-size:.9rem;min-height:1.2em}.msg.ok{color:var(--mist)}

.card .h{padding:12px 14px;color:var(--foam);font-weight:600;display:flex;align-items:center;gap:10px}
.dot{width:34px;height:34px;border-radius:50%;background:var(--deep);border:1.5px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--foam);flex:none}
.card img,.card video{width:100%;display:block;max-height:560px;object-fit:cover}
.card .a{display:flex;align-items:center;gap:6px;padding:10px 14px 2px}
.card .a button{width:auto;background:none;color:var(--foam);padding:4px;display:flex;gap:6px;align-items:center;font-weight:600}
.card .a button.m{color:var(--sun)}.card .a button.m svg{fill:var(--sun)}
.card p{padding:2px 14px 14px;color:var(--foam)}
#sbar{display:flex;gap:14px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.s1{flex:none;width:62px;text-align:center;font-size:11px;cursor:pointer;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s}
.s1:active{transform:scale(.93)}
.s1 svg{display:block;margin:0 auto 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
.grid3 .th{aspect-ratio:1;background:var(--deep);cursor:pointer}
.grid3 img,.grid3 video{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.row .n{flex:1;color:var(--foam);font-weight:600;min-width:0}.row .n small{display:block;font-weight:400;color:var(--mist)}
.stats{display:flex;gap:22px;text-align:center;color:var(--foam);font-weight:700}.stats small{display:block;font-weight:400;color:var(--mist)}
details{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{padding:14px 16px;color:var(--foam);font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--teal)}details[open] summary::after{content:"\2212"}
details>.col{padding:0 16px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(2,26,25,.88);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}
nav button{background:none;color:var(--mist);width:56px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--teal)}
nav button.plus{background:var(--teal);color:var(--abyss);border-radius:14px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--abyss);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px)}}
#view{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
#vp{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
#vp i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;position:relative;overflow:hidden}
#vp i.d{background:#fff}
#vp i.a::after{content:"";position:absolute;inset:0;background:#fff;animation:pr 5s linear forwards}
@keyframes pr{from{transform:translateX(-100%)}to{transform:none}}
#vn{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:.9rem}
#vn button{background:none;color:#fff;width:auto;font-size:1.6rem;padding:0 8px}
#vb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#vb img,#vb video{max-width:100%;max-height:100%}
#cm{display:flex;flex-direction:column;gap:6px;padding:8px 0 90px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);color:var(--foam);align-self:flex-start;word-break:break-word}
.b.me{background:var(--teal);color:var(--abyss);align-self:flex-end}

</style>

function closeV(){clearTimeout(V.t);if(V.au){V.au.pause();V.au=null}$("view").hidden=true;$("vb").innerHTML=""}
$("vx").onclick=function(e){e.stopPropagation();closeV()};
$("view").onclick=function(e){if(e.clientX<innerWidth/3)V.i=Math.max(0,V.i-1);else V.i++;showV()};

/* new post / story */
function openSheet(m){SH=m;$("sheet").hidden=false;sheetMode()}
function sheetMode(){document.querySelectorAll("[data-sh]").forEach(function(b){b.className=b.dataset.sh==SH?"on":""});$("cap").hidden=SH!="post";$("smus").hidden=SH!="story";say("sm","")}
document.querySelectorAll("[data-sh]").forEach(function(b){b.onclick=function(){SH=b.dataset.sh;sheetMode()}});
$("scancel").onclick=function(){$("sheet").hidden=true};
$("share").onclick=async function(){
  var cap=$("cap").value.trim(),f=$("file").files[0],path=null;
  if(SH=="story"&&!f){say("sm","Choose a photo or video");return}
  if(SH=="post"&&!cap&&!f){say("sm","Write something or choose a file");return}
  say("sm","Uploading...",1);
  if(f){path=fpath(f,SH=="story"?"s-":"");var up=await sb.storage.from("media").upload(path,f);if(up.error){say("sm",up.error.message);return}}
  var r=SH=="story"?await sb.from("stories").insert({user_id:me.id,media_path:path,music:$("smus").value||null}):await sb.from("posts").insert({user_id:me.id,caption:cap,media_path:path});
  if(r.error){say("sm",r.error.message);return}
  $("cap").value="";$("file").value="";$("sheet").hidden=true;toast(SH=="story"?"Story shared":"Posted");go("home");
};

/* search + follow */
var QT;
$("q").oninput=function(){clearTimeout(QT);QT=setTimeout(async function(){
  var q=$("q").value.trim().toLowerCase();if(q.length<2){$("res").innerHTML="";return}
  var r=await sb.from("profiles").select("id,username,display_name").ilike("username","%"+q+"%").neq("id",me.id).limit(20);
  $("res").innerHTML=(r.data||[]).map(function(u){return '<div class="row" style="cursor:default"><div class="dot">'+ini(u.username)+'</div><div class="n">@'+esc(u.username)+'<small>'+esc(u.display_name||"")+'</small></div><button class="g s" data-act="follow" data-id="'+u.id+'">'+(FW[u.id]?"Following":"Follow")+'</button><button class="s" data-act="chat" data-id="'+u.id+'">Message</button></div>'}).join("")||'<p class="msg ok">No one found.</p>';
},300)};

/* profile + settings */
async function profile(){
  $("pu").textContent="@"+(pr.username||"");$("pdn").textContent=pr.display_name||pr.username||"";$("pbio").textContent=pr.bio||"";
  $("pav").innerHTML=bs(ini(pr.username),84);
  var a=await sb.from("posts").select("id,media_path").eq("user_id",me.id).order("created_at",{ascending:false});
  var f1=await sb.from("follows").select("follower",{count:"exact",head:true}).eq("following",me.id);
  var f2=await sb.from("follows").select("following",{count:"exact",head:true}).eq("follower",me.id);
  $("c1").innerHTML=(a.data||[]).length+"<small>Posts</small>";$("c2").innerHTML=(f1.count||0)+"<small>Followers</small>";$("c3").innerHTML=(f2.count||0)+"<small>Following</small>";
  $("pgrid").innerHTML=(a.data||[]).filter(function(x){return x.media_path}).map(function(x){return '<div class="th">'+thumb(x.media_path)+'</div>'}).join("");
}
async function settings(){
  $("e-dn").value=pr.display_name||"";$("e-un").value=pr.username||"";$("e-bio").value=pr.bio||"";
  var a=await sb.from("stories").select("id,media_path,music,created_at").eq("user_id",me.id).lt("expires_at",new Date().toISOString()).order("created_at",{ascending:false});
  ARC=a.data||[];$("arc0").hidden=ARC.length>0;
  $("arc").innerHTML=ARC.map(function(s,k){return '<div class="th" data-act="arc" data-k="'+k+'">'+thumb(s.media_path)+'</div>'}).join("");
}
$("e-save").onclick=async function(){
  var u=$("e-un").value.trim().toLowerCase();
  if(!UN.test(u)){say("e-m","Username must be 3-20 characters: a-z, 0-9, _ and .");return}
  var r=await sb.from("profiles").update({username:u,display_name:$("e-dn").value.trim(),bio:$("e-bio").value.trim()}).eq("id",me.id);
  if(r.error){say("e-m",r.error.message.indexOf("duplicate")>=0?"That username is taken":r.error.message);return}
  pr.username=u;pr.display_name=$("e-dn").value.trim();pr.bio=$("e-bio").value.trim();say("e-m","Profile saved",1);
};
$("pw-save").onclick=async function(){
  var p=$("e-pw").value;if(p.length<8){say("pw-m","Password must be at least 8 characters");return}
  var r=await sb.auth.updateUser({password:p});
  if(r.error){say("pw-m",r.error.message);return}
  $("e-pw").value="";say("pw-m","Password changed",1);
};

/* end-to-end encrypted messages (keys never leave this device) */
var EC={name:"ECDH",namedCurve:"P-256"};
async function keys(){
  var k=localStorage.getItem("bb_key_"+me.id);
  if(k){var j=JSON.parse(k);KP={priv:await crypto.subtle.importKey("jwk",j.priv,EC,false,["deriveKey"]),pub:j.pub}}
  else{
    var p=await crypto.subtle.generateKey(EC,true,["deriveKey"]);
    var pj=await crypto.subtle.exportKey("jwk",p.privateKey),qj=JSON.stringify(await crypto.subtle.exportKey("jwk",p.publicKey));
    localStorage.setItem("bb_key_"+me.id,JSON.stringify({priv:pj,pub:qj}));KP={priv:p.privateKey,pub:qj};
  }
  if(pr.public_key!==KP.pub){await sb.from("profiles").update({public_key:KP.pub}).eq("id",me.id);pr.public_key=KP.pub}
}
function b64(a){return btoa(String.fromCharCode.apply(null,new Uint8Array(a)))}
function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function skey(){
  if(SK[C.id])return SK[C.id];
  var pk=await crypto.subtle.importKey("jwk",JSON.parse(C.pub),EC,false,[]);
  return SK[C.id]=await crypto.subtle.deriveKey({name:"ECDH",public:pk},KP.priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function msgs(){
  var r=await sb.from("messages").select("sender,receiver").order("created_at",{ascending:false}).limit(300);
  var ps=[];(r.data||[]).forEach(function(m){var p=m.sender==me.id?m.receiver:m.sender;if(ps.indexOf(p)<0)ps.push(p)});
  if(!ps.length){$("clist").innerHTML='<p style="text-align:center;margin-top:30px">No conversations yet. Find someone with the search icon and tap Message.</p>';return}
  var u=await sb.from("profiles").select("id,username,display_name").in("id",ps),by={};(u.data||[]).forEach(function(x){by[x.id]=x});
  $("clist").innerHTML=ps.map(function(id){var x=by[id]||{};return '<div class="row" data-act="chat" data-id="'+id+'"><div class="dot" style="width:46px;height:46px">'+ini(x.username)+'</div><div class="n">'+esc(x.display_name||x.username)+'<small>@'+esc(x.username)+'</small></div></div>'}).join("");
}
async function openConv(id){
  var p=await sb.from("profiles").select("id,username,display_name,public_key").eq("id",id).single();
  if(!p.data)return;
  C={id:id,name:p.data.display_name||p.data.username,pub:p.data.public_key};
  $("cn").textContent=C.name;$("cm").innerHTML="";go("conv");
  $("ci").disabled=!C.pub;$("ci").placeholder=C.pub?"Message":"This person has not opened biobook since secure chat was added";
}
async function loadConv(){
  if(!C.id||$("conv").hidden)return;
  var r=await sb.from("messages").select("id,sender,ciphertext").or("and(sender.eq."+me.id+",receiver.eq."+C.id+"),and(sender.eq."+C.id+",receiver.eq."+me.id+")").order("created_at");
  var d=r.data||[];if(d.length==LC)return;LC=d.length;
  var out="";
  if(C.pub){var k=await skey();for(var i=0;i<d.length;i++){var t;try{var p=d[i].ciphertext.split(".");t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(p[0])},k,ub(p[1])))}catch(e){t="Cannot decrypt on this device"}out+='<div class="b'+(d[i].sender==me.id?" me":"")+'">'+esc(t)+'</div>'}}
  $("cm").innerHTML=out;scrollTo(0,document.body.scrollHeight);
}
async function sendMsg(){
  var t=$("ci").value.trim();if(!t||!C.pub)return;
  var k=await skey(),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(t));
  var r=await sb.from("messages").insert({sender:me.id,receiver:C.id,ciphertext:b64(iv)+"."+b64(c)});
  if(r.error){toast(r.error.message);return}
  $("ci").value="";loadConv();
}
$("cs").onclick=sendMsg;$("ci").onkeydown=function(e){if(e.key=="Enter")sendMsg()};

/* all taps */
document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-go],[data-act]");if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  var a=t.dataset.act,d=t.dataset;
  if(a=="new")openSheet("post");
  else if(a=="addstory")openSheet("story");
  else if(a=="story"&&G[d.u])openV(G[d.u],0);
  else if(a=="arc")openV(ARC,+d.k);
  else if(a=="call")toast("Voice and video calls are coming in the next update");
  else if(a=="out")sb.auth.signOut();
  else if(a=="chat")openConv(d.id);
  else if(a=="like"){
    var on=d.m=="1",n=t.querySelector("span");d.m=on?"0":"1";t.classList.toggle("m",!on);n.textContent=Math.max(0,+n.textContent+(on?-1:1));
    if(on)await sb.from("likes").delete().eq("post_id",d.id).eq("user_id",me.id);else await sb.from("likes").insert({post_id:+d.id,user_id:me.id});
  }
  else if(a=="del"){
    if(!confirm("Delete this post?"))return;
    await sb.from("posts").delete().eq("id",d.id);if(d.p)await sb.storage.from("media").remove([d.p]);feed();
  }
  else if(a=="follow"){
    if(FW[d.id]){delete FW[d.id];t.textContent="Follow";await sb.from("follows").delete().eq("follower",me.id).eq("following",d.id)}
    else{FW[d.id]=1;t.textContent="Following";await sb.from("follows").insert({follower:me.id,following:d.id})}
  }
});
sb.auth.getSession().then(function(r){enter(r.data.session)});
setMode("in");
