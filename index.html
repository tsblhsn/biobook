<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>biobook</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--abyss:#021a19;--deep:#06302d;--teal:#2bb3a6;--mist:#9fd1ca;--foam:#e4f6f2;--line:#14504a}
*{box-sizing:border-box;margin:0}
body{background:var(--abyss);color:var(--mist);font:400 1rem/1.6 "Manrope",system-ui,sans-serif;min-height:100svh}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:auto;padding:16px 16px 90px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--foam);font-weight:600;font-size:1.2rem}
header .sp{margin-left:auto;font-size:.85rem;font-weight:400}
input,button,textarea,select{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--foam);padding:10px 12px;width:100%}
button{background:var(--teal);color:var(--abyss);border:0;font-weight:600;cursor:pointer}
button.g{background:none;color:var(--mist);border:1px solid var(--line);width:auto;padding:6px 12px;font-weight:400}
.col{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px}.tabs button{background:var(--deep);color:var(--mist)}.tabs button.on{background:var(--teal);color:var(--abyss)}
.card{background:var(--deep);border-radius:14px;margin:14px 0;overflow:hidden}
.card .h{padding:10px 14px;color:var(--foam);font-weight:600;display:flex;align-items:center}
.card img,.card video{width:100%;display:block}
.card p{padding:10px 14px}
.msg{color:#ffb4a8;font-size:.9rem;min-height:1.2em}.msg.ok{color:var(--mist)}
h2{color:var(--foam);font-size:1rem;margin:22px 0 8px}
#sbar{display:flex;gap:12px;overflow-x:auto;padding:6px 0 14px}
.s1{flex:none;width:64px;text-align:center;font-size:11px;cursor:pointer;color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:58px;height:58px;border-radius:50%;border:2px solid var(--teal);margin:0 auto 3px;display:flex;align-items:center;justify-content:center;background:var(--deep);color:var(--foam);font-size:20px;font-weight:600}
.ring.add{border-style:dashed}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid3 .th{aspect-ratio:1;background:var(--deep);cursor:pointer;overflow:hidden}
.grid3 img,.grid3 video{width:100%;height:100%;object-fit:cover;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(2,26,25,.92);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
nav button{background:var(--deep);color:var(--mist)}nav button.on{background:var(--teal);color:var(--abyss)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--abyss);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px}
#view{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column}
#vp{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
#vp i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;position:relative;overflow:hidden}
#vp i.d{background:#fff}
#vp i.a::after{content:"";position:absolute;inset:0;background:#fff;animation:pr 5s linear forwards}
@keyframes pr{from{transform:translateX(-100%)}to{transform:none}}
#vn{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:.9rem}
#vn button{background:none;color:#fff;width:auto;font-size:1.4rem;padding:0 6px}
#vb{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#vb img,#vb video{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg width="30" height="33" viewBox="0 0 110 120" aria-label="biobook"><path d="M20 12H56C80 12 92 24 92 39C92 49 87 56 80 59C91 63 97 71 97 83C97 101 83 112 58 112H20Z" fill="#ffe51a" stroke="#1f4fb0" stroke-width="12" stroke-linejoin="round"/><path d="M42 30H54C62 30 66 34 66 39C66 44 62 48 54 48H42ZM42 68H56C65 68 70 72 70 80C70 88 65 94 56 94H42Z" fill="#1f4fb0"/></svg>
biobook<span class="sp" id="who"></span>
</header>

<div id="auth" class="col" hidden>
<div class="tabs"><button id="t-in" class="on">Log in</button><button id="t-up">Sign up</button></div>
<input id="un" placeholder="Username" hidden autocapitalize="none">
<input id="em" type="email" placeholder="Email" autocomplete="email">
<input id="pw" type="password" placeholder="Password (at least 8 characters)" autocomplete="current-password">
<button id="go">Log in</button>
<div class="msg" id="am"></div>
</div>

<div id="home" hidden>
<div id="sbar"></div>
<div class="col">
<textarea id="cap" rows="2" placeholder="What is on your mind?"></textarea>
<input id="file" type="file" accept="image/*,video/*">
<button id="post">Post</button>
<div class="msg" id="pm"></div>
</div>
<div id="feed"></div>
</div>

<div id="prof" hidden>
<h2 id="pn"></h2>
<h2>Story archive</h2>
<div class="grid3" id="arc"></div>
<p id="arc0" class="msg ok" hidden>No archived stories yet. Stories move here 24 hours after posting.</p>
<h2>Settings</h2>
<div class="col">
<input id="e-dn" placeholder="Name">
<input id="e-un" placeholder="Username" autocapitalize="none">
<textarea id="e-bio" rows="2" placeholder="Bio"></textarea>
<button id="e-save">Save profile</button>
<div class="msg" id="e-m"></div>
<input id="e-pw" type="password" placeholder="New password (at least 8 characters)" autocomplete="new-password">
<button id="pw-save">Change password</button>
<div class="msg" id="pw-m"></div>
<button class="g" id="out" style="width:100%">Log out</button>
</div>
</div>
</div>

<nav id="nav" hidden><button id="n-home" class="on">Home</button><button id="n-prof">Profile</button></nav>

<div class="ov" id="sheet" hidden><div class="sheet col">
<b style="color:var(--foam)">New story (visible for 24 hours)</b>
<input id="sfile" type="file" accept="image/*,video/*">
<select id="smus"></select>
<button id="spost">Share story</button>
<button class="g" id="scancel" style="width:100%">Cancel</button>
<div class="msg" id="sm"></div>
</div></div>

<div id="view" hidden>
<div id="vp"></div>
<div id="vn"><span id="vname"></span><button id="vx" aria-label="Close">&times;</button></div>
<div id="vb"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var sb=supabase.createClient("https://phrxgyjzalrhadwjreio.supabase.co","sb_publishable_60EewNpV4m19eOgdcpTKVw_rxcZYf7D");
var $=function(i){return document.getElementById(i)},mode="in",me=null,pr={},G={},ARC=[];
var MUSIC=[["No music",""],["Calm Waves","music/calm-waves.mp3"],["Night Drive","music/night-drive.mp3"],["Sunrise Beat","music/sunrise-beat.mp3"]];
$("smus").innerHTML=MUSIC.map(function(m){return '<option value="'+m[1]+'">'+(m[1]?"\u266A ":"")+m[0]+'</option>'}).join("");
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function pub(p){return sb.storage.from("media").getPublicUrl(p).data.publicUrl}
function isV(p){return /\.(mp4|mov|webm)$/i.test(p||"")}
function mname(f){for(var i=0;i<MUSIC.length;i++)if(MUSIC[i][1]==f)return MUSIC[i][0];return""}
function fpath(f,pre){var ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");return me.id+"/"+pre+Date.now()+"."+ext}
function view(v){["auth","home","prof"].forEach(function(k){$(k).hidden=k!=v});$("nav").hidden=v=="auth";$("n-home").className=v=="home"?"on":"";$("n-prof").className=v=="prof"?"on":"";if(v=="home"){feed();stories()}if(v=="prof")profile()}
function setMode(m){mode=m;$("t-in").className=m=="in"?"on":"";$("t-up").className=m=="up"?"on":"";$("un").hidden=m!="up";$("go").textContent=m=="in"?"Log in":"Create account";$("am").textContent=""}
$("t-in").onclick=function(){setMode("in")};$("t-up").onclick=function(){setMode("up")};
$("n-home").onclick=function(){view("home")};$("n-prof").onclick=function(){view("prof")};
function say(id,t,ok){var e=$(id);e.className="msg"+(ok?" ok":"");e.textContent=t}
var UN=/^[a-z0-9_.]{3,20}$/;
$("go").onclick=async function(){
  var email=$("em").value.trim(),password=$("pw").value,r;say("am","");
  if(mode=="up"){
    var u=$("un").value.trim().toLowerCase();
    if(!UN.test(u)){say("am","Username must be 3-20 characters: a-z, 0-9, _ and .");return}
    r=await sb.auth.signUp({email:email,password:password,options:{data:{username:u}}});
    if(!r.error&&!r.data.session){say("am","Check your email to confirm, then log in.",1);return}
  }else r=await sb.auth.signInWithPassword({email:email,password:password});
  if(r.error)say("am",r.error.message);
};
$("out").onclick=function(){sb.auth.signOut()};
async function enter(session){
  me=session?session.user:null;
  if(!me){$("who").textContent="";view("auth");return}
  var p=await sb.from("profiles").select("username,display_name,bio").eq("id",me.id).single();
  pr=p.data||{};$("who").textContent=pr.username?"@"+pr.username:"";
  view("home");
}
sb.auth.onAuthStateChange(function(_e,s){setTimeout(function(){enter(s)},0)});

/* feed */
async function feed(){
  var r=await sb.from("posts").select("id,caption,media_path,created_at,user_id,profiles(username)").order("created_at",{ascending:false}).limit(30);
  if(r.error){$("feed").innerHTML='<div class="msg">'+esc(r.error.message)+'</div>';return}
  $("feed").innerHTML=r.data.map(function(x){
    var url=x.media_path?pub(x.media_path):"";
    return '<div class="card"><div class="h">@'+esc(x.profiles&&x.profiles.username)+(x.user_id==me.id?'<button class="g" style="margin-left:auto" data-d="'+x.id+'" data-p="'+esc(x.media_path||"")+'">Delete</button>':'')+'</div>'+
      (url?(isV(x.media_path)?'<video src="'+url+'" controls playsinline></video>':'<img src="'+url+'" alt="" loading="lazy">'):'')+
      '<p>'+esc(x.caption)+'</p></div>';
  }).join("")||'<p style="margin-top:20px">No posts yet.</p>';
}
$("feed").onclick=async function(e){
  var b=e.target.closest("[data-d]");if(!b||!confirm("Delete this post?"))return;
  await sb.from("posts").delete().eq("id",b.dataset.d);
  if(b.dataset.p)await sb.storage.from("media").remove([b.dataset.p]);
  feed();
};
$("post").onclick=async function(){
  var cap=$("cap").value.trim(),f=$("file").files[0],path=null;
  if(!cap&&!f){say("pm","Write something or choose a file");return}
  say("pm","Uploading...",1);
  if(f){path=fpath(f,"");var up=await sb.storage.from("media").upload(path,f);if(up.error){say("pm",up.error.message);return}}
  var r=await sb.from("posts").insert({user_id:me.id,caption:cap,media_path:path});
  if(r.error){say("pm",r.error.message);return}
  $("cap").value="";$("file").value="";say("pm","");feed();
};

/* stories */
async function stories(){
  var r=await sb.from("stories").select("id,user_id,media_path,music,created_at,profiles(username)").gt("expires_at",new Date().toISOString()).order("created_at");
  G={};(r.data||[]).forEach(function(s){(G[s.user_id]=G[s.user_id]||[]).push(s)});
  var ids=Object.keys(G).sort(function(a,b){return a==me.id?-1:b==me.id?1:0});
  $("sbar").innerHTML='<div class="s1" data-add="1"><div class="ring add">+</div>Add story</div>'+ids.map(function(id){
    var n=G[id][0].profiles?G[id][0].profiles.username:"?";
    return '<div class="s1" data-u="'+id+'"><div class="ring">'+esc(n.charAt(0).toUpperCase())+'</div>'+(id==me.id?"Your story":esc(n))+'</div>';
  }).join("");
}
$("sbar").onclick=function(e){
  if(e.target.closest("[data-add]")){$("sheet").hidden=false;return}
  var b=e.target.closest("[data-u]");if(b&&G[b.dataset.u])openV(G[b.dataset.u],0);
};
$("scancel").onclick=function(){$("sheet").hidden=true};
$("spost").onclick=async function(){
  var f=$("sfile").files[0];if(!f){say("sm","Choose a photo or video");return}
  say("sm","Uploading...",1);
  var path=fpath(f,"s-"),up=await sb.storage.from("media").upload(path,f);
  if(up.error){say("sm",up.error.message);return}
  var r=await sb.from("stories").insert({user_id:me.id,media_path:path,music:$("smus").value||null});
  if(r.error){say("sm",r.error.message);return}
  $("sfile").value="";say("sm","");$("sheet").hidden=true;stories();
};

/* story viewer */
var V={list:[],i:0,t:null,au:null};
function openV(list,i){V.list=list;V.i=i;$("view").hidden=false;showV()}
function showV(){
  clearTimeout(V.t);if(V.au){V.au.pause();V.au=null}
  var s=V.list[V.i];if(!s){closeV();return}
  var u=pub(s.media_path),v=isV(s.media_path);
  $("vp").innerHTML=V.list.map(function(_,k){return '<i class="'+(k<V.i?"d":k==V.i?"a":"")+'"></i>'}).join("");
  $("vname").textContent="@"+(s.profiles?s.profiles.username:pr.username)+(s.music?"  \u266A "+mname(s.music):"");
  $("vb").innerHTML=v?'<video id="vv" src="'+u+'" autoplay playsinline></video>':'<img src="'+u+'" alt="">';
  if(s.music){V.au=new Audio(s.music);V.au.loop=true;V.au.play().catch(function(){})}
  if(v)$("vv").onended=function(){V.i++;showV()};else V.t=setTimeout(function(){V.i++;showV()},5000);
}
function closeV(){clearTimeout(V.t);if(V.au){V.au.pause();V.au=null}$("view").hidden=true;$("vb").innerHTML=""}
$("vx").onclick=function(e){e.stopPropagation();closeV()};
$("view").onclick=function(e){if(e.clientX<innerWidth/3)V.i=Math.max(0,V.i-1);else V.i++;showV()};

/* profile and settings */
async function profile(){
  $("pn").textContent=(pr.display_name||pr.username||"")+" (@"+(pr.username||"")+")";
  $("e-dn").value=pr.display_name||"";$("e-un").value=pr.username||"";$("e-bio").value=pr.bio||"";
  var a=await sb.from("stories").select("id,media_path,music,created_at").eq("user_id",me.id).lt("expires_at",new Date().toISOString()).order("created_at",{ascending:false});
  ARC=a.data||[];$("arc0").hidden=ARC.length>0;
  $("arc").innerHTML=ARC.map(function(s,k){var u=pub(s.media_path);return '<div class="th" data-k="'+k+'">'+(isV(s.media_path)?'<video src="'+u+'" muted playsinline></video>':'<img src="'+u+'" alt="" loading="lazy">')+'</div>'}).join("");
}
$("arc").onclick=function(e){var b=e.target.closest("[data-k]");if(b)openV(ARC,+b.dataset.k)};
$("e-save").onclick=async function(){
  var u=$("e-un").value.trim().toLowerCase();
  if(!UN.test(u)){say("e-m","Username must be 3-20 characters: a-z, 0-9, _ and .");return}
  var r=await sb.from("profiles").update({username:u,display_name:$("e-dn").value.trim(),bio:$("e-bio").value.trim()}).eq("id",me.id);
  if(r.error){say("e-m",r.error.message.indexOf("duplicate")>=0?"That username is taken":r.error.message);return}
  pr={username:u,display_name:$("e-dn").value.trim(),bio:$("e-bio").value.trim()};
  $("who").textContent="@"+u;$("pn").textContent=(pr.display_name||u)+" (@"+u+")";say("e-m","Profile saved",1);
};
$("pw-save").onclick=async function(){
  var p=$("e-pw").value;if(p.length<8){say("pw-m","Password must be at least 8 characters");return}
  var r=await sb.auth.updateUser({password:p});
  if(r.error){say("pw-m",r.error.message);return}
  $("e-pw").value="";say("pw-m","Password changed",1);
};
sb.auth.getSession().then(function(r){enter(r.data.session)});
setMode("in");
</script>
</body>
</html>
